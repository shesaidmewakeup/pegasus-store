<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Товар — Pegasus Store</title>
  <script>
    // Перенаправление со старого адреса /product.html?id=... на новую карточку.
    (function () {
      var search = window.location.search || '';
      window.location.replace(window.location.pathname.replace(/product\.html$/, '') + '#/product' + search);
    })();
  </script>
</head>
<body>
  <p>Карточка товара переехала. <a href="#/product">Перейти</a></p>
</body>
</html>
