<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Каталог — Pegasus Store</title>
  <script>
    // Перенаправление со старого адреса /catalog.html на новый каталог.
    (function () {
      var search = window.location.search || '';
      window.location.replace(window.location.pathname.replace(/catalog\.html$/, '') + '#/catalog' + search);
    })();
  </script>
</head>
<body>
  <p>Каталог переехал. <a href="#/catalog">Перейти</a></p>
</body>
</html>
